name: CI

# Les vérifications d'une pull request. La publication du site, à chaque fusion sur main, est à part
# (publication.yml) : ainsi, aucune étape « ignorée » ne s'affiche sur les pull requests.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Un nouveau push sur une pull request annule la vérification devenue inutile de la précédente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Les vérifications tournent en parallèle, chacune sur sa machine ; les tests dans Chrome, les plus
# longs, se partagent entre six machines. Après la fusion en rebase, main porte exactement l'arbre
# vérifié ici : il n'est plus que construit et publié.
#
# Mesuré sur un passage vert : installer les dépendances prend 5 s (cache npm), le build 2 s, les
# types 2 s, les tests unitaires 30 s ; tout le temps est dans les tests dans Chrome, qui jouent de
# vraies routines (appuis de 3 s, fondus). Le seul levier est donc leur partage : avec trois machines,
# chacune en avait pour près de 2 min ; avec six, pour 1 min.
jobs:
  types:
    name: Journal et types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Historique complet : le journal est comparé à la branche de base.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          # Version de Node figée pour tout le monde (.nvmrc).
          node-version-file: .nvmrc
          cache: npm

      # Chaque changement doit s'accompagner d'une entrée dans CHANGELOG.md.
      - name: Journal des versions
        run: node outils/check-changelog.ts --base "${{ github.event.pull_request.base.sha }}"

      - run: npm ci

      - name: Vérification des types
        run: npm run typecheck

  unitaires:
    name: Tests unitaires
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Les tests des scripts du build lisent l'historique (numéro de build, journal).
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Tests unitaires
        run: npm test

  chrome:
    # Le nombre de parties est celui de la matrice (strategy.job-total) : pour en changer, une seule liste.
    name: Tests dans Chrome (${{ matrix.partie }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # Une partie en échec n'arrête pas les autres : on voit tous les tests qui échouent.
      fail-fast: false
      matrix:
        partie: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
        with:
          # Historique complet : le numéro de version est le nombre de commits.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      # L'app compilée dans Chrome sans interface, sur un écran de téléphone simulé :
      # chaque routine jusqu’au retour au menu, l’écrou des réglages, la sortie de secours et le hors-ligne.
      # Chaque machine joue un test sur six (E2E_PARTIE, tests/e2e/app.e2e.ts).
      # Google Chrome est préinstallé sur les machines ubuntu de GitHub (variable CHROME_BIN).
      # Limite de temps : une page de Chrome qui ne se ferme pas ne doit pas bloquer la CI.
      - name: Tests dans Chrome
        timeout-minutes: 6
        env:
          E2E_PARTIE: ${{ matrix.partie }}/${{ strategy.job-total }}
        run: npm run test:e2e

  # Le contrôle exigé par la protection de main : vert seulement si toutes les vérifications le sont.
  verdict:
    name: Types, tests, build et tests dans Chrome
    needs: [types, unitaires, chrome]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Toutes les vérifications sont vertes
        run: |
          echo "types : ${{ needs.types.result }}, unitaires : ${{ needs.unitaires.result }}, Chrome : ${{ needs.chrome.result }}"
          test "${{ needs.types.result }}" = success
          test "${{ needs.unitaires.result }}" = success
          test "${{ needs.chrome.result }}" = success
